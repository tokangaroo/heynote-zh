name: Build

on: push

defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: ${{ matrix.os }}
    if: ${{ startsWith(github.ref, 'refs/tags/v') || contains(github.event.head_commit.message, '#build') }}
    permissions:
      contents: write

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: win
          - os: ubuntu-latest
            platform: linux

    env:
      # electron-builder 在 tag 推送时自动发布到 GitHub Releases
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # @vscode/ripgrep 的 postinstall 下载 rg 时调用 GitHub API，
      # 注入 token 避免 CI 出口 IP 触发 403 限流（变量名必须是 GITHUB_TOKEN）
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Check out Git repository
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build frontend & main process
        run: npm run prebuild

      # @vscode/ripgrep 的 rg 二进制按当前架构下载，
      # 因此先构建 x64，再切换 rg 到 arm64 后构建 arm64
      - name: Build x64 packages
        run: npx electron-builder -c electron-builder.json5 --${{ matrix.platform }} --x64

      - name: Switch ripgrep binary to arm64
        run: npm_config_arch=arm64 node node_modules/@vscode/ripgrep/lib/postinstall.js

      - name: Build arm64 packages
        run: npx electron-builder -c electron-builder.json5 --${{ matrix.platform }} --arm64

      # electron-builder 对 AppImage 的 ${arch} 展开为 x86_64，统一改名为 amd64
      - name: Normalize AppImage artifact names
        if: ${{ matrix.os == 'ubuntu-latest' }}
        run: |
          for f in release/*/Heynote_zh_*_linux_x86_64.AppImage; do
            [ -e "$f" ] && mv "$f" "${f/x86_64/amd64}"
          done

      - name: Upload Windows artifacts
        if: ${{ matrix.os == 'windows-latest' }}
        uses: actions/upload-artifact@v4
        with:
          name: heynote-zh-windows-${{ github.sha }}
          path: |
            release/*/Heynote_zh_*.exe
            release/*/Heynote_zh_*.zip
          retention-days: 30
          if-no-files-found: error

      - name: Upload Linux artifacts
        if: ${{ matrix.os == 'ubuntu-latest' }}
        uses: actions/upload-artifact@v4
        with:
          name: heynote-zh-linux-${{ github.sha }}
          path: |
            release/*/Heynote_zh_*.AppImage
            release/*/Heynote_zh_*.deb
          retention-days: 30
          if-no-files-found: error
